<main class="system-container">
  
  @if (isShutDown()) {
    <!-- THE FLATLINE: INSTITUTIONAL BRUTALISM -->
    <div class="flatline-clinical-screen">
      
      <div class="flatline-wrapper">
        <!-- Oś kalibracji z przelatującym sonarem -->
        <div class="baseline-track">
          <div class="baseline-sonar"></div>
        </div>

        <!-- Główny, asymetryczny blok przerwania z maskującym tłem -->
        <div class="clinical-core-block">
          <div class="text-micro">// KERNEL_HALT :: DAILY_ROLLOVER_PROTOCOL</div>
          <div class="text-status">[ EXECUTIONS_LOCKED ] :: LIQUIDITY_GAP</div>
          <div class="text-clock">SYNC_RESUME :: {{ epochSync() }}</div>
        </div>
      </div>

      <!-- Odczyt peryferyjny -->
      <div class="perimeter-void-status">EXPOSURE_VECTOR : NULL</div>

    </div>
  } @else if (systemState() === 'locked') {
    <app-hero-terminal (bootSequenceComplete)="startBootSequence()"></app-hero-terminal>
  } @else {
    <app-header></app-header>
    
    <div class="hero-split">
      <app-artifact-display></app-artifact-display>
      <app-live-stream></app-live-stream>
    </div>

    <app-architecture></app-architecture>
    <app-observatory></app-observatory>
    
    <app-capital-projection></app-capital-projection>
    
    <div class="bottom-split">
      <app-access-protocol></app-access-protocol>
      <app-metrics-feed></app-metrics-feed>
    </div>

    <app-footer></app-footer>
  }

</main>
