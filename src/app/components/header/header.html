<header class="sys-header">
  
  <!-- Główna nawigacja i statusy -->
  <div class="header-row top-row">
    <div class="panel left-panel">
      <span class="dim-text">PROJECT // <span class="white-text">0x6A</span></span>
      <span class="separator">|</span>
      <span class="dim-text">STATUS <span class="status-square"></span> <span class="green-text">OBSERVING</span></span>
    </div>
    
    <div class="panel middle-panel menu-links">
      <span>/KERNEL</span>
      <span>/SCHEMA</span>
      <span> /TELEM_ARRAY</span>
      <span>/ACCESS_PORT</span>
    </div>
    
    <div class="panel right-panel">
      <span class="dim-text">{{ currentTime() }}</span>
      <span class="dim-text">BUILD 06A.09</span>
      <span class="dim-text">NODE ACTIVE</span>
      <span class="amber-text">ACCESS RESTRICTED</span>
    </div>
  </div>

</header>
